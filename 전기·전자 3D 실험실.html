<script>
const T=THREE,PI=Math.PI,V=(x,y,z)=>new T.Vector3(x,y,z),cv=document.getElementById('cv');

function size(){const w=cv.clientWidth,h=cv.clientHeight;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}new ResizeObserver(size).observe(cv);size();

const M=(c,e,i)=>new T.MeshStandardMaterial({color:c,roughness:.4,metalness:.3,emissive:e||0,emissiveIntensity:i||0});
const bx=(w,h,d,c,x=0,y=0,z=0)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);return m};
const gl=(w,h,d,c,x,y,z,o)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c,transparent:true,opacity:o,roughness:.3,depthWrite:false}));m.position.set(x,y,z);return m};
const tb=(p,q,r,c)=>{const d=q.clone().sub(p),m=new T.Mesh(new T.CylinderGeometry(r,r,d.length(),10),M(c));m.position.copy(p).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return m};
const ball=(r,c)=>new T.Mesh(new T.SphereGeometry(r,12,10),M(c,c,.6));
const bulb=(x,y,z,r)=>{const g=new T.Group(),m=M(0xfff3b0,0xffd54a,0);m.transparent=true;m.opacity=.92;g.add(new T.Mesh(new T.SphereGeometry(r,20,16),m),new T.Mesh(new T.CylinderGeometry(r*.5,r*.6,r*.8,16),M(0x6b7280)).translateY(-r*1.05));g.position.set(x,y,z);return{o:g,m}};
const PL=pts=>{const L=[0];pts.forEach((p,i)=>L.push(L[i]+p.distanceTo(pts[(i+1)%pts.length])));const tot=L[pts.length];return u=>{const d=(((u%1)+1)%1)*tot;let i=0;while(L[i+1]<d)i++;return pts[i].clone().lerp(pts[(i+1)%pts.length],(d-L[i])/(L[i+1]-L[i]))}};
const wire=(g,pts,c=0xb45309,closed=true)=>pts.forEach((p,i)=>{if(closed||i<pts.length-1)g.add(tb(p,pts[(i+1)%pts.length],.07,c))});

const S=[
{n:'① 전기 회로 (직류 · 교류)',d:'회로는 전원, 스위치, 부하(전구), 도선으로 이루어져요. 스위치를 닫으면 전자가 도선을 따라 흐르고 전구가 켜져요. 직류(DC)는 한 방향으로만 흐르고, 교류(AC)는 방향이 계속 바뀌어요. (전자는 −극에서 +극으로 움직여요)',q:'스위치를 열면 전구는 왜 꺼질까요? 교류에서는 전자가 앞으로 계속 나아갈까요?',
b(){const g=new T.Group(),P=[V(-4,-2.5,0),V(4,-2.5,0),V(4,2.5,0),V(-4,2.5,0)],pos=PL(P),E=[],n=44;let on=1,ac=0,R=2,u=0;
 wire(g,P);

 const rs=new T.Mesh(new T.CylinderGeometry(.38,.38,1.8,16).rotateZ(PI/2),M(0xe2c89b));rs.position.set(0,2.5,0);g.add(rs);[-.5,0,.5].forEach((x,i)=>{const r=new T.Mesh(new T.CylinderGeometry(.4,.4,.12,16).rotateZ(PI/2),M([0xdc2626,0x2563eb,0x111827][i]));r.position.set(x,2.5,0);g.add(r)});

 ui:[['b','스위치 열기/닫기',x=>{on=!on}],['b','직류 ⇄ 교류',x=>{ac=!ac}],['r','저항 (전류 세기 조절)',1,4,.1,2,v=>R=v]],

 sample:t=>[on?(ac?sinv(t,.7)/R:1/R):0],gl:'전류'}}},
{n:'② 변압기',d:'철심 양쪽에 코일을 다른 횟수로 감은 부품이에요. 왼쪽(1차) 코일에 교류가 흐르면 철심에 자기장이 바뀌고, 오른쪽(2차) 코일에 전압이 생겨요. 감은 수의 비율만큼 전압이 달라져요. 직류에서는 자기장이 변하지 않아 작동하지 않아요.',q:'2차 코일을 적게 감으면 전압이 낮아져요. 스마트폰 충전기(220V→5V)는 어느 쪽이 훨씬 적을까요?',
b(){const g=new T.Group(),sec=new T.Group(),pr=new T.Group(),F=[],n=22,fp=PL([V(-2.8,-1.8,0),V(2.8,-1.8,0),V(2.8,1.8,0),V(-2.8,1.8,0)]);let N2=6;
 const coil=(x0,k)=>{const c=new T.Curve();c.getPoint=(u,o=new T.Vector3())=>{const a=u*k*2*PI;return o.set(x0+.95*Math.cos(a),-1.1+2.2*u,.95*Math.sin(a))};return new T.Mesh(new T.TubeGeometry(c,k*18,.07,6),M(0xc2762b))};
 g.add(bx(1.4,5,1.2,0x6b7280,-2.8,0,0),bx(1.4,5,1.2,0x6b7280,2.8,0,0),bx(7,1.4,1.2,0x6b7280,0,1.8,0),bx(7,1.4,1.2,0x6b7280,0,-1.8,0),pr,sec);
 pr.add(coil(-2.8,12));const reb=()=>{while(sec.children.length)sec.remove(sec.children[0]);sec.add(coil(2.8,N2))};reb();
 [[-3.75,-5.3],[3.75,5.3]].forEach(([a,b])=>[1.1,-1.1].forEach(y=>g.add(tb(V(a,y,0),V(b,y,0),.07,0xb45309))));
 const bl=bulb(6,0,0,.8);g.add(bl.o,tb(V(5.3,1.1,0),V(5.9,.55,0),.07,0xb45309),tb(V(5.3,-1.1,0),V(5.9,-.6,0),.07,0xb45309),bx(.5,1.3,.9,0x374151,-5.6,0,0));
 for(let i=0;i<n;i++){const f=ball(.12,0x22d3ee);F.push(f);g.add(f)}
 return{g,cam:[0,2,14],lb:[['1차 코일 (12번)',-3.8,1.6,0],['철심 (자기장이 지나가요)',0,2.9,0],['2차 코일',3.8,1.6,0],['교류 220V 입력',-5.6,1.1,0],['전구',6,1.5,0]],
 ui:[['r','2차 코일 감은 수',1,24,1,6,v=>{N2=v;reb()}]],
 tick(t){const w=sinv(t,.5);F.forEach((f,i)=>f.position.copy(fp(i/n+.07*w)));bl.m.emissiveIntensity=Math.min(1,N2/12)*1.3*Math.abs(Math.sin(PI*t*.5+.4)*.3+.7);
  setSt('입력 220V (12번) → 출력 '+Math.round(220*N2/12)+'V ('+N2+'번) · '+(N2<12?'감압 (전압을 낮춤)':N2>12?'승압 (전압을 높임)':'전압 그대로'))},
 sample:t=>{const w=sinv(t,.5);return[w/1.7,Math.max(-1,Math.min(1,N2/12*w/1.7))]},gl:'전압 (파랑 입력 · 주황 출력)'}}},
{n:'③ 전동기 (모터)',d:'자석 사이에 코일을 넣고 전류를 흘리면 코일에 힘(F)이 생겨요. 한쪽은 밀고 반대쪽은 당겨서 코일이 돌아요. 반 바퀴마다 정류자가 전류 방향을 바꿔 줘서 계속 한 방향으로 회전해요. 전기 에너지 → 회전 운동 에너지!',q:'정류자가 없다면 코일은 어떻게 될까요? 보라색 전류 화살표가 바뀌는 순간을 찾아보세요.',b(){return MG(0)}},
{n:'④ 발전기',d:'전동기와 구조는 같지만 반대로 작동해요. 손잡이로 코일을 돌리면 자석 사이에서 전자기 유도가 일어나 전기가 만들어져요. 코일이 돌 때마다 전류 방향이 바뀌는 교류가 나와요. 회전 운동 에너지 → 전기 에너지!',q:'빠르게 돌리면 전구가 어떻게 달라질까요? 전류 방향 화살표와 아래 그래프를 함께 보세요.',b(){return MG(1)}},
{n:'⑤ 다이오드 (정류 · LED)',d:'p형 반도체(정공, +)와 n형 반도체(전자, −)를 붙인 부품이에요. 순방향으로 전압을 걸면 전자와 정공이 접합면을 지나 전류가 흘러 LED가 켜지고, 역방향이면 전류가 흐르지 않아요. 그래서 교류를 한쪽 방향(직류)으로만 흐르게 하는 정류 작용을 해요.',q:'역방향일 때 가운데 회색 영역(공핍층)은 어떻게 변할까요? 교류를 넣으면 출력 그래프는 어떤 모양일까요?',
b(){const g=new T.Group(),H=[],El=[],n=12;let mode=0,wd=.5,b=1,lt=-1;
 g.add(gl(3,1.6,1.6,0xef4444,-1.5,0,0,.3),gl(3,1.6,1.6,0x3b82f6,1.5,0,0,.3));const dep=gl(1,1.7,1.7,0xcbd5e1,0,0,0,.6);g.add(dep);
 wire(g,[V(-3,0,0),V(-4,0,0),V(-4,2.6,0),V(-.9,2.6,0)],0xb45309,false);wire(g,[V(3,0,0),V(4,0,0),V(4,2.6,0),V(.9,2.6,0)],0xb45309,false);
 const led=bulb(4,1.3,0,.4);led.m.color.set(0xff6b6b);led.m.emissive.set(0xff3b3b);g.add(led.o,bx(1.8,.7,.7,0x374151,0,2.6,0));
 const pl=ball(.14,0xef4444),mi=ball(.14,0x111827);g.add(pl,mi);
 for(let i=0;i<n;i++){const h=ball(.13,0xfda4af),e=ball(.1,0x93c5fd);h.position.set(-3+Math.random()*2,(Math.random()-.5)*1.2,(Math.random()-.5)*1.2);e.position.set(1+Math.random()*2,(Math.random()-.5)*1.2,(Math.random()-.5)*1.2);H.push(h);El.push(e);g.add(h,e)}
 return{g,cam:[0,2.5,11],lb:[['p형 (정공 +)',-1.5,1.2,0],['n형 (전자 −)',1.5,1.2,0],['접합면 (공핍층)',0,-1.3,0],['LED (순방향일 때 켜져요)',4,2.2,0],['전원',0,3.3,0]],
 ui:[['b','순방향',x=>mode=0],['b','역방향',x=>mode=1],['b','교류 넣기 (정류)',x=>mode=2]],
 tick(t,dt){b=mode==0?1:mode==1?-1:sinv(t,.4);const I=Math.max(0,b);wd+=((b>0?.3:1.5)-wd)*Math.min(1,dt*4);dep.scale.x=wd;
  H.forEach(h=>{let x=h.position.x+b*1.3*dt;if(b>0&&x>1.4)x=-3;if(x<-3)x=-3;if(x>-wd/2&&b<0)x=-wd/2;h.position.x=x});
  El.forEach(e=>{let x=e.position.x-b*1.3*dt;if(b>0&&x<-1.4)x=3;if(x>3)x=3;if(x<wd/2&&b<0)x=wd/2;e.position.x=x});
  pl.position.set(b>=0?-.5:.5,2.6,.5);mi.position.set(b>=0?.5:-.5,2.6,.5);led.m.emissiveIntensity=I*1.5;
  setSt(mode==2?'교류 입력 → 순방향일 때만 전류가 흘러요 (정류 작용)':mode==0?'순방향: 전자·정공이 접합면을 넘어 전류가 흐르고 LED가 켜져요':'역방향: 전자·정공이 멀어지고 공핍층이 넓어져 전류가 차단돼요')},
 sample:t=>{const v=mode==0?1:mode==1?-1:sinv(t,.4);return[v,Math.max(0,v)]},gl:'입력(파랑) → 출력(주황)'}}},
{n:'⑥ 트랜지스터 (증폭 · 스위칭)',d:'p형과 n형 반도체를 번갈아 붙인 npn형 트랜지스터예요. 베이스(B)에 아주 작은 전류를 흘리면 이미터(E)에서 컬렉터(C)로 큰 전류가 흘러요. 작은 신호로 큰 전류를 조종하니 증폭 작용이고, 전류를 연결·차단하면 스위칭 작용이에요.',q:'베이스 전류를 0으로 하면 전구는? 조금만 늘려도 전구가 크게 밝아지는 까닭은?',
b(){const g=new T.Group(),E=[],B=[],n=40;let f=0;
 g.add(gl(2,1.4,1.4,0x3b82f6,-2.4,0,0,.45),gl(.9,1.4,1.4,0xef4444,-.95,0,0,.55),gl(3,1.4,1.4,0x3b82f6,1,0,0,.45));
 wire(g,[V(2.5,0,0),V(4,0,0),V(4,-2.6,0),V(-4.5,-2.6,0),V(-4.5,0,0),V(-3.4,0,0)],0xb45309,false);
 const bp=[V(-4.5,0,0),V(-4.5,2.6,0),V(-.95,2.6,0),V(-.95,.7,0)];wire(g,bp,0xb45309,false);const bpl=PL(bp.concat([V(-4.5,0,0)]).slice(0,4));
